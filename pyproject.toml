[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deploom-mcp"
version = "0.2.33"
description = "Dependency planning and host-authorized verified goal execution for supported DepLoom profiles."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp>=2,<3",
    "requests",
    "semantic_version",
    "python-dateutil",
    "PyYAML>=6,<7",
    "z3-solver==4.13.0.0",
    "jsonschema>=4,<5",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/levencode-labs/deploom-mcp"

[project.scripts]
deploom-mcp = "deploom_mcp.server:main"
deploom-workspace = "deploom_mcp.workspace_edits:main"
deploom-install-skill = "deploom_mcp.distribution:install_skill_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deploom_mcp = ["py.typed", "migration_usage.cjs", "standalone_audit_guard.cjs", "records-seed.json", "records-public.hex"]
