name: Component release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to resume; never moves it
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: component-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      tagObject: ${{ steps.identity.outputs.tagObject }}
      version: ${{ steps.identity.outputs.version }}
      ciRuns: ${{ steps.identity.outputs.ciRuns }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for existing full main CI on this exact commit
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release_ci.py wait-main --tag "$RELEASE_TAG"
  package:
    needs: qualify
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
      artifact-digest: ${{ steps.bundle.outputs.artifact-digest }}
      manifest-sha: ${{ steps.assets.outputs.manifest-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.commit }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install runtime and build prerequisites
        run: python -m pip install -e . build setuptools wheel
      - name: Sanitize, build, install, rebuild from sdist and smoke exact assets
        id: assets
        env:
          RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
          REQUIRED_MAIN_CI_JSON: ${{ needs.qualify.outputs.ciRuns }}
          EXPECTED_TAG_OBJECT: ${{ needs.qualify.outputs.tagObject }}
        run: python scripts/release_ci.py build --tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        id: bundle
        with:
          name: component-release-${{ needs.qualify.outputs.commit }}
          path: .component-release/ci-artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  correctness:
    needs: qualify
    uses: ./.github/workflows/correctness-preflight.yml
    with:
      release_ref: ${{ needs.qualify.outputs.commit }}
  d1:
    needs: qualify
    uses: ./.github/workflows/d1-pilot-preflight.yml
    with:
      release_ref: ${{ needs.qualify.outputs.commit }}
  proxy:
    needs: qualify
    uses: ./.github/workflows/proxy-osv-live.yml
    with:
      release_ref: ${{ needs.qualify.outputs.commit }}
  linux-image:
    name: Linux amd64 image and cache smoke
    needs: [qualify, package, correctness, d1, proxy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the Streamable HTTP smoke client
        run: python -m pip install 'mcp>=2,<3'
      - name: Build or recover the tagged image
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.qualify.outputs.commit }}
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker pull --platform linux/amd64 "$image" >"$RUNNER_TEMP/deploom-pull.log" 2>&1; then
            publish=false
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$RELEASE_COMMIT"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "$RELEASE_VERSION"
          elif grep -Eqi 'manifest unknown|not found|pull access denied|denied: denied' "$RUNNER_TEMP/deploom-pull.log"; then
            publish=true
            docker build --platform linux/amd64 -t "$image" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
              --label "org.opencontainers.image.version=$RELEASE_VERSION" .
          else
            cat "$RUNNER_TEMP/deploom-pull.log" >&2
            exit 1
          fi
          printf 'SMOKE_IMAGE=%s\nPUSH_IMAGE=%s\n' "$image" "$publish" >> "$GITHUB_ENV"
      - name: Check the image entrypoint, scope and persistent cache
        env:
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          core="$(git -C upstream/deploom rev-parse HEAD)"
          python scripts/smoke_linux_image.py "$SMOKE_IMAGE" --version "$RELEASE_VERSION" --core "$core"
      - name: Publish and verify the registry digest resolves to the tested image
        env:
          RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.qualify.outputs.commit }}
        run: |
          set -euo pipefail
          tested="$(docker image inspect --format '{{.Id}}' "$SMOKE_IMAGE")"
          if [[ "$PUSH_IMAGE" == true ]]; then
            docker push "$SMOKE_IMAGE"
          fi
          digest="$(docker buildx imagetools inspect "$SMOKE_IMAGE" | awk '/^Digest:/ { print $2 }')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="${SMOKE_IMAGE%:*}@$digest"
          docker pull --platform linux/amd64 "$ref"
          test "$(docker image inspect --format '{{.Id}}' "$ref")" = "$tested"
          anonymous_config="$(mktemp -d)"
          if DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$ref" >/dev/null 2>&1; then
            pull_access=anonymous
          else
            pull_access=authenticated
          fi
          jq -n --arg image "$SMOKE_IMAGE" --arg digest "$digest" --arg ref "$ref" \
            --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            --arg core "$(git -C upstream/deploom rev-parse HEAD)" --arg pullAccess "$pull_access" \
            '{image:$image,digest:$digest,ref:$ref,tag:$tag,commit:$commit,core:$core,platform:"linux/amd64",pullAccess:$pullAccess}' \
            > "$RUNNER_TEMP/deploom-container-image.json"
          printf 'Linux amd64 image tested and verified in GHCR\n\n    %s\n\nPull access: %s\n' "$ref" "$pull_access" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: container-image-${{ needs.qualify.outputs.commit }}
          path: ${{ runner.temp }}/deploom-container-image.json
          if-no-files-found: error
  publish:
    needs: [qualify, package, correctness, d1, proxy, linux-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: release-artifacts
      - name: Verify immutable assets, publish draft, verify public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
          RELEASE_ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact-digest }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha }}
          EXPECTED_TAG_OBJECT: ${{ needs.qualify.outputs.tagObject }}
        run: python scripts/release_ci.py publish --tag "$RELEASE_TAG" --artifacts release-artifacts
